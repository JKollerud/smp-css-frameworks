<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="bg-gray-500 min-h-screen">
    <header class="bg-white border-b">
      <div
        class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <a href="/" class="font-bold">Social</a>
        <nav class="hidden sm:flex gap-4">
          <a class="hover:underline" href="../feed/index.html">Feed</a>
          <a class="hover:underline" href="index.html">Profile</a>
        </nav>
        <button class="sm:hidden p-2" aria-label="Menu">☰</button>
      </div>
    </header>
    <main class="max-w-5xl mx-auto p-4 space-y-6">
      <section
        class="bg-white rounded-xl shadow p-6 flex flex-col sm:flex-row sm:items-center gap-6"
      >
        <img
          class="w-28 h-28 rounded-full object-cover"
          src="https://images.unsplash.com/photo-1740252117070-7aa2955b25f8?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2080"
        />
        <div class="flex-1">
          <h1 class="text-2xl font-bold">@username</h1>
          <div class="flex gap-6 mt-2 text-sm text-gray-600">
            <span><strong>350</strong> Posts</span>
            <span><strong>249</strong> Followers</span>
            <span><strong>300</strong> Following</span>
          </div>
        </div>
        <button
          class="bg-blue-600 text-white px-4 py-2 rounded-lg self-start hover:bg-blue-800"
        >
          Follow
        </button>
      </section>
      <section class="bg-white rounded-xl shadow p-6">
        <h2 class="font-semibold mb-3">Posts</h2>
        <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
          <img
            class="w-full h-40 object-cover rounded-lg"
            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2070"
          />
          <img
            class="w-full h-40 object-cover rounded-lg"
            src="https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2069"
          />
          <img
            class="w-full h-40 object-cover rounded-lg"
            src="https://images.unsplash.com/photo-1517760444937-f6397edcbbcd?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2070"
          />
        </div>
      </section>
    </main>
  </body>
</html>
