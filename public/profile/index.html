<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../js/menu.js" defer></script>
    <script src="../js/profile.js" defer></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div id="toast" role="status" aria-live="polite"></div>

    <div
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image viewer"
    >
      <button id="lightbox-close" aria-label="Close image">&times;</button>
      <img id="lightbox-img" src="" alt="Full size post image" />
    </div>

    <header class="bg-white border-b sticky top-0 z-20 shadow-sm">
      <div
        class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <a href="/" class="font-bold text-blue-600 text-lg tracking-tight"
          >Social</a
        >
        <nav class="hidden sm:flex gap-6">
          <a
            class="hover:text-blue-600 transition-colors"
            href="../feed/index.html"
            >Feed</a
          >
          <a
            class="hover:text-blue-600 transition-colors active"
            href="index.html"
            >Profile</a
          >
        </nav>
        <button
          class="sm:hidden p-2 rounded hover:bg-gray-100 transition-colors"
          aria-label="Menu"
          data-menu-toggle
        >
          ☰
        </button>
      </div>
      <nav class="sm:hidden border-t px-4 py-2 space-y-1 hidden" data-menu>
        <a
          class="block py-1 hover:text-blue-600 transition-colors"
          href="../feed/index.html"
          >Feed</a
        >
        <a
          class="block py-1 hover:text-blue-600 transition-colors"
          href="./index.html"
          >Profile</a
        >
      </nav>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">
      <section
        class="bg-white rounded-xl shadow p-6 flex flex-col sm:flex-row sm:items-center gap-6"
      >
        <img
          class="w-28 h-28 rounded-full object-cover ring-2 ring-blue-100"
          src="https://images.unsplash.com/photo-1740252117070-7aa2955b25f8?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2080"
          alt="Profile photo of @username"
        />
        <div class="flex-1">
          <h1 class="text-2xl font-bold">@username</h1>
          <p class="text-sm text-gray-500 mt-0.5">
            Sharing moments and ideas ✨
          </p>
          <div class="flex gap-6 mt-3 text-sm text-gray-600">
            <button
              class="hover:text-blue-600 transition-colors text-left"
              aria-label="350 posts"
            >
              <strong class="text-gray-900">350</strong> Posts
            </button>
            <button
              class="hover:text-blue-600 transition-colors text-left"
              aria-label="249 followers"
            >
              <strong class="text-gray-900" id="followers-count">249</strong>
              Followers
            </button>
            <button
              class="hover:text-blue-600 transition-colors text-left"
              aria-label="300 following"
            >
              <strong class="text-gray-900">300</strong> Following
            </button>
          </div>
        </div>
        <button
          class="follow-btn bg-blue-600 text-white px-5 py-2 rounded-lg self-start hover:bg-blue-700 transition-colors font-medium"
          id="follow-btn"
          aria-pressed="false"
        >
          Follow
        </button>
      </section>

      <section class="bg-white rounded-xl shadow p-6">
        <h2 class="font-semibold mb-4 text-gray-800">
          Posts <span class="text-gray-400 font-normal text-sm">(3)</span>
        </h2>
        <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">
          <div
            class="post-img-wrap"
            tabindex="0"
            role="button"
            aria-label="View post 1"
          >
            <img
              class="w-full h-40 object-cover loading"
              src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2070"
              alt="Post 1: landscape"
              loading="lazy"
            />
            <div class="overlay">🔍</div>
          </div>

          <div
            class="post-img-wrap"
            tabindex="0"
            role="button"
            aria-label="View post 2"
          >
            <img
              class="w-full h-40 object-cover loading"
              src="https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2069"
              alt="Post 2: outdoor scene"
              loading="lazy"
            />
            <div class="overlay">🔍</div>
          </div>

          <div
            class="post-img-wrap"
            tabindex="0"
            role="button"
            aria-label="View post 3"
          >
            <img
              class="w-full h-40 object-cover loading"
              src="https://images.unsplash.com/photo-1517760444937-f6397edcbbcd?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=2070"
              alt="Post 3: nature"
              loading="lazy"
            />
            <div class="overlay">🔍</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
